name = "clavos-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
APP_ENV = "development"
CORS_ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174"

[[d1_databases]]
binding = "DB"
database_name = "clavos-dev"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PRIVATE_DOCUMENTS"
bucket_name = "clavos-documents-dev"

[[queues.producers]]
binding = "JOBS"
queue = "clavos-jobs-dev"

[[queues.consumers]]
queue = "clavos-jobs-dev"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[observability]
enabled = true
